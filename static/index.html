
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Коллекция игр</title>
</head>

<body>
    <div class="app-layout">

        
        <aside class="sidebar">
            <div class="sidebar-profile">
                
                <span id="sidebar-username">Пользователь</span>
            </div>

            <button id="logout-button" class="logout-button">
                Выйти
            </button>
        </aside>


        <main class="main-content">

            <section class="hello-banner">
                <div>
                    <h1>Привет, <span id="username"></span>!</h1>
                    <p>Продолжим играть?</p>
                </div>
            </section>

            <section class="stats-section">

                <div class="stats-card stats-1">
                    <p class="stats-p-min">Всего игр</p>
                    <h2 id="total-games">0</h2>
                </div>

                <div class="stats-card stats-2">
                    <p class="stats-p-min">Пройдено</p>
                    <h2 id="completed-games">0</h2>
                </div>

                <div class="stats-card stats-3">
                    <p class="stats-p-min">Часов в играх</p>
                    <h2 id="total-hours">0</h2>
                </div>

                <div class="stats-card stats-4">
                    <p class="stats-p-min">Средняя оценка</p>
                    <h2 id="average-rating">—</h2>
                </div>

            </section>

            <section class="toolbar">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Поиск игр..."
                >

                <select id="platform-filter">
                    <option value="">Все платформы</option>
                </select>

                <select id="status-filter">
                    <option value="">Все статусы</option>
                </select>

                <button id="add-game-button">
                    + Добавить игру
                </button>

            </section>

            <div id="add-game-form" class="modal-overlay" hidden>
                <div class="modal-window">
                    <h2>Добавить игру</h2>

                    <form id="game-form">
                        <input type="hidden" id="game-id">

                        <input type="hidden" id="game-cover-url">

                        <div class="rawg-search">
                            <input
                                type="search"
                                id="rawg-search"
                                placeholder="Найти игру в RAWG..."
                                autocomplete="off"
                            >

                            <div id="rawg-results"></div>
                        </div>

                        <input type="text" id="game-title" placeholder="Название игры" required>

                        <textarea id="game-description" placeholder="Описание игры"></textarea>

                        <select id="game-platform" required>
                            <option value="">Выбери платформу</option>
                        </select>

                        <select id="game-status" required>
                            <option value="">Выбери статус</option>
                        </select>

                            <input type="number" id="game-hours" placeholder="Сколько часов сыграно" min="0" step="0.1">

                            <input type="number" id="game-rating" placeholder="Оценка" min="0" max="10" step="0.1">

                            <input type="text" id="game-genre" placeholder="Жанр">

                            <label for="game-date">Дата выхода</label>
                            <input type="date" id="game-date">

                        <button type="submit">Сохранить игру</button>
                        <button type="button" id="cancel-game-button">Отмена</button>
                    </form>
                </div>
            </div>

            <section class="collection-layout">

                <div class="games-section">
                    <h2>Моя коллекция</h2>

                    <p id="message">Загрузка...</p>

                    <div id="games-list" class="games-grid"></div>
                </div>

                <aside class="top-section">
                    <h2>Топ игр</h2>
                    <p>Лучшие игры по оценке</p>

                    <div id="top-games-list"></div>
                </aside>

            </section>

        </main>
    </div>

    <script src="/static/js/index.js"></script>
</body>
</html>
