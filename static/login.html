<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Вход</title>
</head>


<body>
    <main>
        <p>Вход</p>

        <form class="login-form" id="login-form">
            <div class="input">
                <label for="username">Логин</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >
            </div>

            <div class="input">
                <label for="password">Пароль</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <button class="button-login" type="submit">Войти</button>
        </form>

        <p id="message"></p>

        <p>
            Нет аккаунта?
            <a href="/static/register.html">Зарегистрироваться</a>
        </p>
    </main>

    <script src="/static/js/login.js"></script>
</body>
</html>
